services:
  orchestrator:
    build:
      context: ../../
      dockerfile: apps/orchestrator/Dockerfile
    image: specwave-orchestrator:local
    container_name: specwave-orchestrator
    environment:
      SPECWAVE_ORCHESTRATOR_HOST: "0.0.0.0"
      SPECWAVE_ORCHESTRATOR_PORT: "8787"
      SPECWAVE_ORCHESTRATOR_TICK_MS: "60000"
      SPECWAVE_ORCHESTRATOR_STATE: "/data/orchestrator-state.json"
      SPECWAVE_ORCHESTRATOR_APPROVAL_RISK_LEVELS: "R3"
      SPECWAVE_DINGTALK_ROBOT_WEBHOOK: "${SPECWAVE_DINGTALK_ROBOT_WEBHOOK:-}"
      SPECWAVE_DINGTALK_ROBOT_SECRET: "${SPECWAVE_DINGTALK_ROBOT_SECRET:-}"
      SPECWAVE_DINGTALK_ROBOT_KEYWORD: "${SPECWAVE_DINGTALK_ROBOT_KEYWORD:-}"
      SPECWAVE_DINGTALK_APPBOT_TENANT_ID: "${SPECWAVE_DINGTALK_APPBOT_TENANT_ID:-}"
      SPECWAVE_DINGTALK_APPBOT_PROJECT_ID: "${SPECWAVE_DINGTALK_APPBOT_PROJECT_ID:-}"
      SPECWAVE_DINGTALK_APPBOT_REQUIRE_AT: "${SPECWAVE_DINGTALK_APPBOT_REQUIRE_AT:-true}"
      SPECWAVE_DINGTALK_APPBOT_SIGN_SECRET: "${SPECWAVE_DINGTALK_APPBOT_SIGN_SECRET:-}"
      SPECWAVE_DINGTALK_APPBOT_BOT_NAME: "${SPECWAVE_DINGTALK_APPBOT_BOT_NAME:-}"
      SPECWAVE_DINGTALK_STREAM_CLIENT_ID: "${SPECWAVE_DINGTALK_STREAM_CLIENT_ID:-}"
      SPECWAVE_DINGTALK_STREAM_CLIENT_SECRET: "${SPECWAVE_DINGTALK_STREAM_CLIENT_SECRET:-}"
      SPECWAVE_DINGTALK_STREAM_TENANT_ID: "${SPECWAVE_DINGTALK_STREAM_TENANT_ID:-}"
      SPECWAVE_DINGTALK_STREAM_PROJECT_ID: "${SPECWAVE_DINGTALK_STREAM_PROJECT_ID:-}"
      SPECWAVE_DINGTALK_STREAM_REQUIRE_AT: "${SPECWAVE_DINGTALK_STREAM_REQUIRE_AT:-true}"
      SPECWAVE_DINGTALK_STREAM_BOT_NAME: "${SPECWAVE_DINGTALK_STREAM_BOT_NAME:-}"
      SPECWAVE_TELEGRAM_BOT_TOKEN: "${SPECWAVE_TELEGRAM_BOT_TOKEN:-}"
      SPECWAVE_TELEGRAM_TENANT_ID: "${SPECWAVE_TELEGRAM_TENANT_ID:-}"
      SPECWAVE_TELEGRAM_PROJECT_ID: "${SPECWAVE_TELEGRAM_PROJECT_ID:-}"
      SPECWAVE_TELEGRAM_MODE: "${SPECWAVE_TELEGRAM_MODE:-polling}"
      SPECWAVE_TELEGRAM_REQUIRE_MENTION: "${SPECWAVE_TELEGRAM_REQUIRE_MENTION:-false}"
      SPECWAVE_TELEGRAM_BOT_USERNAME: "${SPECWAVE_TELEGRAM_BOT_USERNAME:-}"
      SPECWAVE_TELEGRAM_ALLOWED_CHAT_IDS: "${SPECWAVE_TELEGRAM_ALLOWED_CHAT_IDS:-}"
      SPECWAVE_TELEGRAM_WEBHOOK_SECRET_TOKEN: "${SPECWAVE_TELEGRAM_WEBHOOK_SECRET_TOKEN:-}"
      SPECWAVE_TELEGRAM_API_BASE_URL: "${SPECWAVE_TELEGRAM_API_BASE_URL:-https://api.telegram.org}"
      SPECWAVE_TELEGRAM_POLLING_TIMEOUT_SEC: "${SPECWAVE_TELEGRAM_POLLING_TIMEOUT_SEC:-20}"
      SPECWAVE_TELEGRAM_POLLING_BACKOFF_MS: "${SPECWAVE_TELEGRAM_POLLING_BACKOFF_MS:-1500}"
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    restart: unless-stopped
